async function boot(){try{S=await api('/api/settings');P=await api('/api/properties');const m=await api('/api/auth/me');if(m.role==='owner'){await ownerApp()}else if(m.role==='customer'){customer=m.customer;await customerApp()}else{publicApp();const pid=new URLSearchParams(location.search).get('property');if(pid)setTimeout(()=>detail(pid),80)}}catch(e){console.error(e);publicApp()}}

let _lastSearchAt=0;async function searchP(){const q=$('sq').value,arr=await api('/api/properties?q='+encodeURIComponent(q)+'&ptype='+encodeURIComponent($('stype').value)+'&bhk='+encodeURIComponent($('sbhk').value)+'&max_price='+encodeURIComponent($('smax').value||0)+'&purpose='+encodeURIComponent($('spurpose')?.value||''));const now=Date.now();if(now-_lastSearchAt>2000){await track('search');_lastSearchAt=now}renderCards(arr);location.hash='properties'}async function track(k){try{await api('/api/events/'+k,{method:'POST'})}catch(e){}}
async function detail(id){

 let imgs=(p.images||[]).map(i=>'<img src="'+(i.url||i.data||'')+'" style="width:100%;height:140px;object-fit:cover;border-radius:12px;cursor:pointer" onclick="lightbox(\''+(i.url||i.data||'').replace(/'/g,'%27')+'\')">').join('');

 try{await api('/api/properties/'+encodeURIComponent(id)+'/view',{method:'POST'})}catch{}
 try{const sims=await api('/api/properties/'+encodeURIComponent(id)+'/similar?limit=4');const box=$('similarProperties');if(box)box.innerHTML='<h4>Similar properties</h4>'+(sims.length?'<div class="grid" style="grid-template-columns:repeat(2,1fr)">'+sims.map(x=>'<div class="resultMini" onclick="detail(\''+x.id+'\')">'+(imageOf(x)?'<img src="'+imageOf(x)+'">':'<div class="photo" style="width:62px;height:55px;border-radius:9px"></div>')+'<div><b>'+esc(x.title)+'</b><div class="muted">'+money(x.price)+' · '+esc(x.location||'')+'</div></div></div>').join('')+'</div>':'<div class="muted">No similar properties found.</div>')}catch(e){const box=$('similarProperties');if(box)box.innerHTML='<h4>Similar properties</h4><div class="muted">Unable to load similar properties.</div>'}}

async function submitVisit(id){if(!$('vc').checked)return toast('Consent is required');if(!$('vd').value||!$('vt').value)return toast('Choose date and time');try{const d=await api('/api/visits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('vn').value,phone:$('vp').value,email:$('ve').value,date:$('vd').value,time:$('vt').value,property_id:id,notes:$('vnote').value,consent:true})});closeM();toast(d.message)}catch(e){toast(e.message)}}
function previewChatImage(input){const box=$('chatImagePreview');if(!box)return;const file=input?.files?.[0];if(!file){clearChatImage();return}if(!/^image\/(jpeg|png|webp)$/i.test(file.type)){box.style.display='flex';box.innerHTML='<span class="muted">Please choose JPG, PNG or WebP.</span><button class="btn chatAttachRemove" onclick="clearChatImage()" aria-label="Remove image" title="Remove">'+I.close+'</button>';return}if(file.size>3*1024*1024){box.style.display='flex';box.innerHTML='<span class="muted">Image is too large. Maximum 3 MB.</span><button class="btn chatAttachRemove" onclick="clearChatImage()" aria-label="Remove image" title="Remove">'+I.close+'</button>';return}const r=new FileReader();r.onload=()=>{box.style.display='flex';box.innerHTML='<img class="chatAttachThumb" src="'+r.result+'" alt="Selected property image"><div class="chatAttachMeta"><div class="chatAttachName">'+esc(file.name)+'</div><div class="muted" style="font-size:11px">Ready to send · '+(file.size/1024/1024).toFixed(1)+' MB</div></div><button class="btn chatAttachRemove" onclick="clearChatImage()" aria-label="Remove image" title="Remove">'+I.close+'</button>';const im=box.querySelector('.chatAttachThumb');if(im)im.onclick=()=>lightbox(r.result)};r.readAsDataURL(file)}

async function sendChat(){const input=$('chatText'),m=input.value.trim(),file=$('chatImage')?.files?.[0];if(!m&&!file)return;const body=$('chatBody');let previewSrc='';if(file){if(file.size>3*1024*1024){toast('Image must be 3 MB or smaller');return}previewSrc=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}input.value='';if(m)body.innerHTML+='<div class="bubble user">'+esc(m)+(file?'<div class="muted" style="font-size:11px;margin-top:6px">Image attached</div>':'')+'</div>';if(file)addSentImageBubble(body,previewSrc);body.innerHTML+='<div class="bubble ai" id="typing"><span class="muted">Thinking…</span></div>';body.scrollTop=body.scrollHeight;try{const d=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m||'Please identify the property image and tell me what you can confirm.',session_id:chatSession,image_data:previewSrc})});$('typing')?.remove();if(d.session_id){chatSession=d.session_id;localStorage.setItem('estate_chat_session',chatSession)}clearChatImage();body.innerHTML+='<div class="bubble ai">'+formatAI(d.answer)+'</div>';if(d.matches&&d.matches.length){d.matches.forEach(p=>{const el=document.createElement('div');el.className='resultMini';el.innerHTML=(imageOf(p)?'<img src="'+imageOf(p)+'">':'<div class="photo" style="width:62px;height:55px;border-radius:9px"></div>')+'<div><b>'+esc(p.title)+'</b><div class="muted">'+money(p.price)+' · '+esc(p.location)+'</div></div>';el.onclick=()=>detail(p.id);body.appendChild(el)})}body.scrollTop=body.scrollHeight}catch(e){const t=$('typing');if(t)t.textContent=e.message;clearChatImage();body.scrollTop=body.scrollHeight}}

><button class="btn chatNew" onclick="newChat()" aria-label="Start new chat" title="New chat">'+I.chat+'</button><button class="btn iconOnly" onclick="toggleChat()" aria-label="Close chat" title="Close">'+I.close+'</button></div></div><div id="chatBody" class="chatBody"><div class="bubble ai">'+esc(S.ai_greeting||'How can I help?')+'</div></div><div class="chatInput"><div id="chatImagePreview" class="chatAttachPreview" style="display:none"></div><label class="btn attachBtn" for="chatImage" aria-label="Attach image" title="Attach property image">'+I.attach+'</label><div class="chatComposer"><input id="chatImage" class="chatImageInput" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewChatImage(this)"><input id="chatText" class="chatText" placeholder="Ask about properties..." autocomplete="off" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();sendChat()}"></div><button class="btn primary sendBtn" onclick="sendChat()" aria-label="Send message" title="Send">'+I.send+'</button></div></div>';const saved=act.saved.map(id=>P.find(p=>p.id===id)).filter(Boolean);$('saved').innerHTML=saved.length?saved.map(savedCard).join(''):'<div class="empty" style="grid-column:1/-1">No saved properties yet.</div>'}

function tab(t,el){currentTab=t;document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');let h='';if(t==='dashboard'){const leads=D.leads.slice(0,6).map(l=>'<div class="notice"><b>'+esc(l.name)+'</b> · '+esc(l.status)+'<div class="muted">'+esc(D.properties.find(p=>p.id===l.property_id)?.title||'General enquiry')+'</div></div>').join('');h='<div class="sectionHead"><div><div class="eyebrow">Private owner control</div><h2>Dashboard</h2><p class="muted">Everything customers do on the website can be managed here.</p></div><button class="btn primary" onclick="propertyForm(\'\')">+ Add property</button></div><div class="metrics">'+metric('Properties',D.properties.length)+metric('Published',D.properties.filter(x=>x.published).length)+metric('Leads',D.leads.length)+metric('AI chats',D.messages.length)+'</div>'+setupChecklist()+'<div class="grid" style="grid-template-columns:1.3fr .7fr"><div class="card"><div class="cardbody"><h3>Recent leads</h3>'+(leads||'<div class="empty">No leads yet.</div>')+'</div></div><div class="card"><div class="cardbody"><h3>Quick controls</h3><button class="btn" style="width:100%;margin:5px 0" onclick="tab(\'properties\')">Manage properties</button><button class="btn" style="width:100%;margin:5px 0" onclick="tab(\'chats\')">Review AI chats</button><button class="btn" style="width:100%;margin:5px 0" onclick="tab(\'settings\')">Update contact numbers</button></div></div></div>'}
if(t==='properties'){
 const rows=D.properties.map(p=>'<tr><td><input type="checkbox" class="propSelect" value="'+esc(p.id)+'"></td><td><b>'+esc(p.title)+'</b>'+(p.is_demo?' <span class="chip">Demo</span>':'')+'<div class="muted">'+esc(p.bhk||'')+' · '+esc(p.area||'')+'</div></td><td>'+money(p.price)+'</td><td>'+esc(p.location||'')+'</td><td>'+(p.published?'<span class="chip">Published</span>':'<span class="chip">Draft</span>')+'</td><td><div class="actions"><button class="btn action-icon" onclick="window.open(\'/?property=\'+p.id,\'_blank\')" title="View">'+I.eye+'</button><button class="btn action-icon" onclick="propertyForm(\''+p.id+'\')" title="Edit">'+I.edit+'</button><button class="btn action-icon" onclick="uploadPrompt(\''+p.id+'\')" title="Images">'+I.image+'</button><button class="btn" onclick="togglePublish(\''+p.id+'\','+(!p.published)+')">'+(p.published?'Unpublish':'Publish')+'</button><button class="btn action-icon" onclick="archiveProp(\''+p.id+'\')" title="Archive">'+I.archive+'</button><button class="btn danger action-icon" onclick="deleteProp(\''+p.id+'\')" title="Delete">'+I.trash+'</button></div></td></tr>').join('');
 h='<div class="sectionHead"><div><div class="eyebrow">Inventory control</div><h2>Properties</h2></div><div class="actions"><button class="btn primary" onclick="propertyForm(\'\')">+ Add property</button><button class="btn" onclick="exportPropertiesCSV()">Export CSV</button><button class="btn" onclick="importPropertiesCSV()">Import CSV</button></div></div><div class="card"><div class="cardbody"><div class="actions"><label class="btn"><input type="checkbox" onchange="toggleAllProperties(this)" style="margin-right:7px"> Select all</label><button class="btn" onclick="bulkProperties(\'publish\')">Publish selected</button><button class="btn" onclick="bulkProperties(\'unpublish\')">Unpublish selected</button><button class="btn" onclick="bulkProperties(\'archive\')">Archive selected</button><button class="btn danger" onclick="bulkProperties(\'delete\')">Delete selected</button></div><div class="tableWrap"><table class="table"><tr><th>Select</th><th>Property</th><th>Price</th><th>Location</th><th>Status</th><th>Actions</th></tr>'+(rows||'<tr><td colspan="6">No properties.</td></tr>')+'</table></div></div></div>'
}

if(t==='customers'){const rows=D.customers.map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'<br>'+esc(c.email)+'</td><td>'+(c.saved||[]).length+'</td><td>'+esc(c.created_at||'')+'</td><td><button class="btn danger action-icon" onclick="deleteCustomer(\''+c.id+'\')" title="Delete">'+I.trash+'</button></td></tr>').join('');h='<div class="sectionHead"><div><div class="eyebrow">Customer accounts</div><h2>Customers</h2></div><div class="actions">'+(D.customers.length?'<button class="btn danger" onclick="clearAll(\'customers\')">Clear all ('+D.customers.length+')</button>':'')+'</div></div><div class="card"><div class="cardbody"><div class="tableWrap"><table class="table"><tr><th>Name</th><th>Contact</th><th>Saved</th><th>Joined</th><th>Action</th></tr>'+(rows||'<tr><td colspan="5">No customer accounts.</td></tr>')+'</table></div></div></div>'}
if(t==='chats'){const rows=D.messages.slice().reverse().map(m=>'<div class="card" style="margin:12px 0"><div class="cardbody"><div class="muted">'+esc(m.at)+' · '+esc(m.customer_id?'Logged-in customer':'Guest')+' · '+esc(D.properties.find(p=>p.id===m.property_id)?.title||'General')+'</div><p><b>Customer:</b> '+esc(m.user)+'</p><p class="muted"><b>AI:</b> '+esc(m.assistant)+'</p><button class="btn danger action-icon" style="margin-top:8px" onclick="deleteChat(\''+m.id+'\')" title="Delete">'+I.trash+'</button></div></div>').join('');h='<div class="sectionHead"><div><div class="eyebrow">Private conversation history</div><h2>AI Conversations</h2><p class="muted">Full website chatbot conversations are private to the owner dashboard.</p></div><div class="actions">'+(D.messages.length?'<button class="btn danger" onclick="clearAll(\'messages\')">Clear all ('+D.messages.length+')</button>':'')+'</div></div>'+(rows||'<div class="empty">No AI conversations yet.</div>')}
if(t==='visits'){const rows=D.visits.map(v=>'<tr><td>'+esc(v.name)+'<div class="muted">'+esc(v.phone)+'</div></td><td>'+esc(D.properties.find(p=>p.id===v.property_id)?.title||'')+'</td><td>'+esc(v.date)+' '+esc(v.time)+'</td><td>'+esc(v.notes||'')+'</td><td><select class="field" onchange="visitStatus(\''+v.id+'\',this.value)">'+['Pending','Confirmed','Rescheduled','Completed','Cancelled'].map(s=>'<option '+(s===v.status?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn danger action-icon" style="margin-top:6px;width:100%" onclick="deleteVisit(\''+v.id+'\')" title="Delete">'+I.trash+'</button></td></tr>').join('');h='<div class="sectionHead"><div><div class="eyebrow">Appointments</div><h2>Site Visits</h2></div><div class="actions">'+(D.visits.length?'<button class="btn danger" onclick="clearAll(\'visits\')">Clear all ('+D.visits.length+')</button>':'')+'</div></div><div class="card"><div class="cardbody"><div class="tableWrap"><table class="table"><tr><th>Customer</th><th>Property</th><th>Date/time</th><th>Notes</th><th>Status</th></tr>'+(rows||'<tr><td colspan="5">No visits.</td></tr>')+'</table></div></div></div>'}
if(t==='analytics'){const rows=D.properties.slice().sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,8).map(p=>'<div class="notice"><b>'+esc(p.title)+'</b><span style="float:right">'+(p.views||0)+' views</span></div>').join('');h='<div class="sectionHead"><div><div class="eyebrow">Performance</div><h2>Analytics</h2></div></div><div class="metrics">'+metric('Property views',D.metrics.property_views||0)+metric('Searches',D.metrics.searches||0)+metric('Calls',D.metrics.calls||0)+metric('WhatsApp',D.metrics.whatsapp||0)+'</div><div class="card"><div class="cardbody"><h3>Most viewed properties</h3>'+(rows||'<div class="empty">No view data yet.</div>')+'</div></div>'}
if(t==='settings'){h='<div class="sectionHead"><div><div class="eyebrow">Private configuration</div><h2>Owner Settings</h2><p class="muted">Change public contact information and AI business context without touching code.</p></div></div><div class="card"><div class="cardbody"><div class="form"><input class="field" id="sb" value="'+esc(S.brand)+'" placeholder="Business name"><input class="field" id="stg" value="'+esc(S.tagline)+'" placeholder="Tagline"><input class="field" id="son" value="'+esc(S.owner_name)+'" placeholder="Owner / agent name"><input class="field" id="soe" value="'+esc(S.owner_email)+'" placeholder="Public email"><input class="field" id="sp" value="'+esc(S.phone)+'" placeholder="Call number"><input class="field" id="sw" value="'+esc(S.whatsapp)+'" placeholder="WhatsApp number"><input class="field" id="sh" value="'+esc(S.business_hours)+'" placeholder="Business hours"><input class="field" id="sad" value="'+esc(S.address)+'" placeholder="Business address"><input class="field full" id="sl" value="'+esc(S.logo_url)+'" placeholder="Logo URL (optional)"><input class="field full" id="shi" value="'+esc(S.hero_image)+'" placeholder="Hero image URL (optional)"><textarea class="field full" id="sa" placeholder="About business">'+esc(S.about)+'</textarea><textarea class="field full" id="sg" placeholder="AI greeting">'+esc(S.ai_greeting)+'</textarea><textarea class="field full" id="sai" rows="8" placeholder="AI business context / rules">'+esc(S.ai_business_context)+'</textarea></div><div class="actions"><button class="btn primary" onclick="saveSettings()">Save settings</button><button class="btn" onclick="exportData()">Export data</button></div></div></div>'}$('dash').innerHTML=h}

function emailVerifyForm(){openM('<h2>Verify your email</h2><p class="muted">Paste the verification token from your email.</p><input class="field full" id="verifyToken" placeholder="Verification token"><div class="actions"><button class="btn primary" onclick="verifyEmailToken()">Verify email</button><button class="btn" onclick="openAuth(\'customer\')">Back to login</button></div>')}
async function verifyEmailToken(){try{const token=$('verifyToken').value.trim();if(!token)return toast('Enter your verification token');const d=await api('/api/customer/verify-email?token='+encodeURIComponent(token));toast(d.message||'Email verified');openAuth('customer')}catch(e){toast(e.message)}}
function passwordResetRequestForm(){openM('<h2>Reset password</h2><p class="muted">Enter your account email. If it exists, reset instructions will be sent.</p><input class="field full" id="resetEmail" type="email" placeholder="Email"><div class="actions"><button class="btn primary" onclick="requestPasswordReset()">Send reset instructions</button><button class="btn" onclick="openAuth(\'customer\')">Back</button></div>')}
async function requestPasswordReset(){try{const email=$('resetEmail').value.trim();if(!email)return toast('Enter your email');const d=await api('/api/customer/password-reset/request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});toast(d.message||'If the account exists, instructions were sent');passwordResetConfirmForm()}catch(e){toast(e.message)}}
function passwordResetConfirmForm(){openM('<h2>Set a new password</h2><p class="muted">Paste the one-time token from the reset email.</p><input class="field full" id="resetToken" placeholder="Reset token"><input class="field full" id="resetNewPassword" type="password" placeholder="New password"><div class="actions"><button class="btn primary" onclick="confirmPasswordReset()">Reset password</button><button class="btn" onclick="passwordResetRequestForm()">Back</button></div>')}
async function confirmPasswordReset(){try{const token=$('resetToken').value.trim(),new_password=$('resetNewPassword').value;if(!token||!new_password)return toast('Enter token and new password');await api('/api/customer/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password})});toast('Password reset. Please log in.');openAuth('customer')}catch(e){toast(e.message)}}
function passwordChangeForm(){openM('<h2>Change password</h2><div class="form"><input class="field full" id="currentPassword" type="password" placeholder="Current password"><input class="field full" id="newPassword" type="password" placeholder="New password"></div><div class="actions"><button class="btn primary" onclick="changeCustomerPassword()">Change password</button><button class="btn" onclick="closeM()">Cancel</button></div>')}
async function changeCustomerPassword(){try{const current_password=$('currentPassword').value,new_password=$('newPassword').value;if(!current_password||!new_password)return toast('Enter both passwords');await api('/api/customer/password-change',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password,new_password})});closeM();toast('Password changed. Please log in again.');setTimeout(()=>openAuth('customer'),400)}catch(e){toast(e.message)}}
async function shareProperty(id){try{const d=await api('/api/properties/'+encodeURIComponent(id)+'/share');if(navigator.share){await navigator.share({title:d.title,text:d.text,url:d.url})}else if(navigator.clipboard){await navigator.clipboard.writeText(d.url);toast('Property link copied')}else{prompt('Copy property link',d.url)}}catch(e){if(e.name!=='AbortError')toast(e.message)}}
function toggleAllProperties(el){document.querySelectorAll('.propSelect').forEach(x=>x.checked=el.checked)}
function selectedPropertyIds(){return [...document.querySelectorAll('.propSelect:checked')].map(x=>x.value)}
async function bulkProperties(action){const ids=selectedPropertyIds();if(!ids.length)return toast('Select at least one property');if(!confirm(action+' '+ids.length+' selected properties?'))return;try{const d=await api('/api/owner/properties/bulk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,action})});await refreshOwner();toast((d.changed||0)+' property(s) updated')}catch(e){toast(e.message)}}
function exportPropertiesCSV(){window.location.href='/api/owner/properties/export.csv'}

async function uploadPropertiesCSV(){const f=$('csvFile')?.files?.[0];if(!f)return toast('Choose a CSV file');if(f.size>2*1024*1024)return toast('CSV must be 2 MB or smaller');try{const csv=await f.text();const d=await api('/api/owner/properties/import.csv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({csv})});closeM();await refreshOwner();toast((d.imported||d.count||0)+' properties imported')}catch(e){toast(e.message)}}
function propertyForm(id){const p=D.properties.find(x=>x.id===id)||{title:'',purpose:'Buy',type:'Apartment',price:'',bhk:'',bathrooms:'',area:'',built_up_area:'',plot_area:'',floor:'',total_floors:'',location:'',locality:'',city:'',state:'',pincode:'',map_url:'',status:'Ready to Move',facing:'',furnishing:'',parking:'',construction_year:'',rera:'',amenities:[],description:'',published:false};const types=['Apartment','Villa','House','Plot','Commercial','Farmhouse'];const statuses=['Ready to Move','Under Construction','New Launch','Resale','Draft','Archived'];const typeSelect='<select class="field" id="pty">'+types.map(t=>'<option '+(p.type===t?'selected':'')+'>'+t+'</option>').join('')+'</select>';const statusSelect='<select class="field" id="pstatus">'+statuses.map(st=>'<option '+(p.status===st?'selected':'')+'>'+st+'</option>').join('')+'</select>';openM('<h2>'+(id?'Edit':'Add')+' property</h2><div class="form"><input class="field" id="pt" placeholder="Property title" value="'+esc(p.title)+'"><select class="field" id="ppr"><option '+(p.purpose==='Buy'?'selected':'')+'>Buy</option><option '+(p.purpose==='Rent'?'selected':'')+'>Rent</option><option '+(p.purpose==='Commercial'?'selected':'')+'>Commercial</option></select>'+typeSelect+'<input class="field" id="pp" type="number" placeholder="Price" value="'+(p.price||'')+'"><input class="field" id="pb" placeholder="BHK" value="'+esc(p.bhk)+'"><input class="field" id="pba" placeholder="Bathrooms" value="'+esc(p.bathrooms)+'"><input class="field" id="pa" placeholder="Carpet area" value="'+esc(p.area)+'"><input class="field" id="pbu" placeholder="Built-up area" value="'+esc(p.built_up_area)+'"><input class="field" id="ppa" placeholder="Plot area" value="'+esc(p.plot_area)+'"><input class="field" id="pf" placeholder="Floor" value="'+esc(p.floor)+'"><input class="field" id="ptf" placeholder="Total floors" value="'+esc(p.total_floors)+'"><input class="field" id="ploc" placeholder="Full location / address" value="'+esc(p.location)+'"><input class="field" id="plocal" placeholder="Locality" value="'+esc(p.locality)+'"><input class="field" id="pcity" placeholder="City" value="'+esc(p.city)+'"><input class="field" id="pstate" placeholder="State" value="'+esc(p.state)+'"><input class="field" id="ppin" placeholder="Pincode" value="'+esc(p.pincode)+'"><input class="field" id="pmap" placeholder="Google Maps URL" value="'+esc(p.map_url)+'"><input class="field" id="pface" placeholder="Facing" value="'+esc(p.facing)+'"><input class="field" id="pfurn" placeholder="Furnishing" value="'+esc(p.furnishing)+'"><input class="field" id="ppark" placeholder="Parking" value="'+esc(p.parking)+'"><input class="field" id="pyear" placeholder="Construction year" value="'+esc(p.construction_year)+'"><input class="field" id="prera" placeholder="RERA number" value="'+esc(p.rera)+'">'+statusSelect+'<textarea class="field full" id="pdesc" placeholder="Complete property description">'+esc(p.description)+'</textarea><input class="field full" id="pam" placeholder="Amenities comma separated" value="'+esc((p.amenities||[]).join(', '))+'"></div><div class="actions"><button class="btn primary" onclick="saveProp('+(id?"'"+id+"'": "''")+')">Save property</button><button class="btn" onclick="closeM()">Cancel</button></div><p class="muted" style="font-size:12px;margin-top:12px">After saving, use the Image button in the property list to upload photos. Published data becomes available to the customer website and AI.</p>')}
async function saveProp(id){const p={title:$('pt').value,purpose:$('ppr').value,type:$('pty').value,price:Number($('pp').value||0),bhk:$('pb').value,bathrooms:$('pba').value,area:$('pa').value,built_up_area:$('pbu').value,plot_area:$('ppa').value,floor:$('pf').value,total_floors:$('ptf').value,location:$('ploc').value,locality:$('plocal').value,city:$('pcity').value,state:$('pstate').value,pincode:$('ppin').value,map_url:$('pmap').value,facing:$('pface').value,furnishing:$('pfurn').value,parking:$('ppark').value,construction_year:$('pyear').value,rera:$('prera').value,status:$('pstatus').value,description:$('pdesc').value,amenities:$('pam').value.split(',').map(x=>x.trim()).filter(Boolean),published:id?D.properties.find(x=>x.id===id)?.published||false:false};try{await api(id?'/api/properties/'+id:'/api/properties',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});closeM();await refreshOwner();toast('Property saved')}catch(e){toast(e.message)}}
function uploadPrompt(id){const p=D.properties.find(x=>x.id===id)||{};const imgs=(p.images||[]).map(i=>'<div class="notice"><span>'+esc(i.name||'Image')+'</span><button class="btn danger action-icon" onclick="deleteImage(\''+id+'\',\''+i.id+'\')" title="Remove" aria-label="Remove">'+I.trash+'</button></div>').join('');openM('<h2>Property images</h2><input id="imgfile" class="field" type="file" accept="image/*"><div class="actions"><button class="btn primary" onclick="uploadImage(\''+id+'\')">Upload image</button><button class="btn" onclick="closeM()">Done</button></div><div style="margin-top:14px">'+(imgs||'<div class="empty">No images yet.</div>')+'</div>')}async function uploadImage(id){const f=$('imgfile').files[0];if(!f)return toast('Choose an image');const fd=new FormData();fd.append('file',f);try{await api('/api/properties/'+id+'/images',{method:'POST',body:fd});closeM();await refreshOwner();toast('Image uploaded')}catch(e){toast(e.message)}}async function togglePublish(id,v){try{await api('/api/properties/'+id+'/publish?published='+v,{method:'POST'});await refreshOwner();if(v){toast('Property published. Website par live hai.');}else{toast('Property unpublished.');}}catch(e){toast(e.message)}}async function archiveProp(id){const p=D.properties.find(x=>x.id===id);if(!p)return;await api('/api/properties/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,status:'Archived',published:false})});await refreshOwner();toast('Property archived')}async function deleteImage(pid,iid){await api('/api/properties/'+pid+'/images/'+iid,{method:'DELETE'});await refreshOwner();uploadPrompt(pid);toast('Image removed')}async function removeDemoData(){if(!confirm('Remove all demo listings?'))return;try{const r=await api('/api/owner/demo-data/remove',{method:'POST'});await refreshOwner();toast(r.removed+' demo listing(s) removed')}catch(e){toast(e.message)}}async function deleteProp(id){if(!confirm('Delete this property?'))return;await api('/api/properties/'+id,{method:'DELETE'});await refreshOwner();toast('Property deleted')}async function leadStatus(id,status){await api('/api/owner/leads/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});D=await api('/api/owner/data')}async function visitStatus(id,status){await api('/api/owner/visits/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});D=await api('/api/owner/data')}async function saveSettings(){try{await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand:$('sb').value,tagline:$('stg').value,owner_name:$('son').value,owner_email:$('soe').value,phone:$('sp').value,whatsapp:$('sw').value,currency:(S.currency||'₹'),business_hours:$('sh').value,address:$('sad').value,logo_url:$('sl').value,hero_image:$('shi').value,about:$('sa').value,ai_greeting:$('sg').value,ai_business_context:$('sai').value})});await refreshOwner();toast('Settings saved')}catch(e){toast(e.message)}}async function exportData(){const d=await api('/api/owner/export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='estateai-owner-export.json';a.click()}async function refreshOwner(){D=await api('/api/owner/data');S=D.settings;tab(currentTab,[...document.querySelectorAll('.side button')].find(x=>x.classList.contains('active')))}
function newChat(){const chatBody=document.getElementById('chatBody');if(chatBody){chatBody.innerHTML='<div class="bubble ai">'+esc(S.ai_greeting||'Hi! How can I help you?')+'</div>';}chatSession='s_'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('estate_chat_session',chatSession);clearChatImage();const chatText=document.getElementById('chatText');if(chatText){chatText.value='';chatText.focus();}toast('New chat started');}
async function deleteLead(id){if(!confirm('Delete this lead?'))return;try{await api('/api/owner/leads/'+id,{method:'DELETE'});D=await api('/api/owner/data');tab('leads',document.querySelector('.side button.active'));toast('Lead deleted')}catch(e){toast(e.message)}}
async function deleteVisit(id){if(!confirm('Delete this visit?'))return;try{await api('/api/owner/visits/'+id,{method:'DELETE'});D=await api('/api/owner/data');tab('visits',document.querySelector('.side button.active'));toast('Visit deleted')}catch(e){toast(e.message)}}
async function deleteCustomer(id){if(!confirm('Delete this customer?'))return;try{await api('/api/owner/customers/'+id,{method:'DELETE'});D=await api('/api/owner/data');tab('customers',document.querySelector('.side button.active'));toast('Customer deleted')}catch(e){toast(e.message)}}

async function clearAll(kind){const names={leads:'all leads',visits:'all visits',customers:'all customers',messages:'all AI conversations'};if(!confirm('Delete '+names[kind]+'? This cannot be undone.'))return;try{const r=await api('/api/owner/clear/'+kind,{method:'POST'});D=await api('/api/owner/data');tab(kind==='messages'?'chats':kind,document.querySelector('.side button.active'));toast(r.cleared+' item(s) cleared')}catch(e){toast(e.message)}}
function formatAI(text){if(!text)return '';let t=String(text);t=t.replace(/\*\*(.+?)\*\*/g,'$1');t=t.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,'$1$2');t=t.replace(/~~(.+?)~~/g,'$1');t=t.replace(/`([^`]+)`/g,'$1');t=t.replace(/^#{1,6}\s+/gm,'');t=t.replace(/^\s*[\*\-]\s+/gm,'• ');t=t.replace(/\*/g,'');t=t.replace(/\n/g,'<br>');return t;}

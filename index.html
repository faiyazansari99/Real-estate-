<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EstateAI — Premium Real Estate</title><style>
:root{--bg:#07100d;--panel:#0d1915;--panel2:#10211b;--text:#eef8f2;--muted:#8ea69a;--line:#1d3329;--accent:#b9f27c;--accent2:#65d7a1;--danger:#ff6f6f;--shadow:0 24px 70px rgba(0,0,0,.32);--radius:22px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% -10%,#193c2c 0,transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1240px;margin:auto;padding:0 22px}.nav{position:sticky;top:0;z-index:50;background:rgba(7,16,13,.78);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.06)}.navin{height:74px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:900;letter-spacing:-.04em;font-size:22px;cursor:pointer}.brand span{color:var(--accent)}.navlinks{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#12221c;color:var(--text);padding:11px 16px;border-radius:13px;font-weight:700}.btn:hover{transform:translateY(-1px);border-color:#365545}.btn.primary{background:var(--accent);color:#07100d;border-color:var(--accent)}.btn.ghost{background:transparent}.btn.danger{background:#2b1416;border-color:#512124;color:#ffb2b2}.iconbtn{width:42px;height:42px;padding:0;border-radius:13px}.hero{padding:86px 0 50px}.heroGrid{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.hero h1{font-size:clamp(48px,7vw,86px);line-height:.94;letter-spacing:-.065em;margin:16px 0}.hero p{font-size:18px;color:var(--muted);max-width:650px;line-height:1.7}.heroCard{min-height:410px;border:1px solid var(--line);border-radius:32px;background:linear-gradient(145deg,#17362a,#0a1511);box-shadow:var(--shadow);padding:18px;position:relative;overflow:hidden}.heroCard:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 25%,rgba(185,242,124,.25),transparent 30%)}.heroMock{position:absolute;inset:22px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));display:flex;align-items:flex-end;padding:24px}.searchbar{margin-top:30px;display:grid;grid-template-columns:1.2fr .8fr .7fr .7fr auto;gap:8px;background:#0c1813;border:1px solid var(--line);padding:8px;border-radius:18px;max-width:1000px}.field{width:100%;background:#0a1511;border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:12px;outline:none}.field:focus{border-color:#517965;box-shadow:0 0 0 3px rgba(101,215,161,.08)}section{padding:48px 0}.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.sectionHead h2{font-size:36px;letter-spacing:-.04em;margin:5px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:linear-gradient(180deg,#102018,#0b1612);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.12)}.cardbody{padding:18px}.photo{height:230px;background:linear-gradient(135deg,#18382b,#0a1511);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.photo .tag{position:absolute;left:12px;top:12px;background:rgba(7,16,13,.82);border:1px solid rgba(255,255,255,.12);padding:7px 10px;border-radius:10px;font-size:12px}.price{font-size:25px;font-weight:900}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chip{padding:7px 9px;border:1px solid var(--line);background:#0a1511;color:#b8c9c0;border-radius:999px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{padding:40px;text-align:center;border:1px dashed #294438;border-radius:18px;color:var(--muted)}.float{position:fixed;right:20px;bottom:20px;z-index:40}.aiBtn{border:1px solid #4e7b60;background:linear-gradient(135deg,var(--accent),#74dca6);color:#07100d;border-radius:999px;padding:15px 19px;font-weight:900;box-shadow:0 18px 50px rgba(0,0,0,.35)}.contactFloat{position:fixed;left:20px;bottom:20px;z-index:40;display:flex;gap:8px}.circle{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:#10221a;color:white;font-weight:900;text-decoration:none}.footer{padding:50px 0;border-top:1px solid var(--line);color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.modal.on{display:flex}.modalbox{width:min(900px,100%);max-height:92vh;overflow:auto;background:#0d1915;border:1px solid #294438;border-radius:24px;padding:22px;box-shadow:var(--shadow)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.ownerShell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 74px)}.side{border-right:1px solid var(--line);padding:20px;position:sticky;top:74px;height:calc(100vh - 74px);background:#08120e}.side button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;border:1px solid transparent;color:#a9bbb2;padding:12px;border-radius:12px}.side button.active,.side button:hover{background:#12231c;color:var(--text);border-color:var(--line)}.main{padding:28px;min-width:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric{background:#0d1a15;border:1px solid var(--line);padding:18px;border-radius:17px;color:var(--muted)}.metric b{display:block;color:var(--text);font-size:28px;margin-top:7px}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:#9bb0a5;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.notice{border:1px solid #2d4a3a;background:#0d1c16;padding:14px;border-radius:14px;color:#b6c8bf;margin:12px 0}.chat{position:fixed;right:20px;bottom:82px;width:min(430px,calc(100vw - 28px));height:min(640px,calc(100vh - 110px));z-index:80;background:#09130f;border:1px solid #31503f;border-radius:24px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden}.chat.on{display:flex}.chatHead{padding:15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.chatBody{padding:14px;overflow:auto;flex:1}.bubble{max-width:88%;padding:11px 13px;border-radius:16px;margin:8px 0;line-height:1.55}.bubble.user{margin-left:auto;background:#1a3427}.bubble.ai{background:#102119;border:1px solid var(--line)}.chatInput{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}.chatInput input{flex:1}.resultMini{display:flex;gap:9px;padding:10px;border:1px solid var(--line);border-radius:13px;margin-top:8px;background:#0d1b15;cursor:pointer}.resultMini img{width:62px;height:55px;object-fit:cover;border-radius:9px}.lightbox img{max-width:100%;max-height:75vh;object-fit:contain;border-radius:18px}.toast{position:fixed;right:20px;top:90px;background:#13251e;border:1px solid #3a604d;padding:13px 16px;border-radius:14px;z-index:200;display:none}.toast.on{display:block}@media(max-width:950px){.heroGrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.searchbar{grid-template-columns:1fr 1fr}.searchbar .wide{grid-column:1/-1}.ownerShell{grid-template-columns:1fr}.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:60;border-right:0;border-top:1px solid var(--line);display:flex;overflow:auto;padding:8px}.side button{min-width:max-content;margin:0}.main{padding:20px;padding-bottom:95px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.navlinks .hideM{display:none}.hero{padding-top:50px}.hero h1{font-size:52px}.grid{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}.metrics{grid-template-columns:1fr 1fr}.sectionHead{display:block}.heroCard{min-height:300px}.contactFloat{left:12px;bottom:15px}.float{right:12px;bottom:15px}.aiBtn{padding:13px 15px}.table{min-width:760px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><script>
const $=id=>document.getElementById(id);const app=$('app');let S={},P=[],D=null,customer=null,currentTab='dashboard';let chatSession=localStorage.getItem('estate_chat_session')||('s_'+Math.random().toString(36).slice(2));localStorage.setItem('estate_chat_session',chatSession);
async function api(url,opt={}){const r=await fetch(url,{credentials:'include',...opt});const t=await r.text();let d;try{d=JSON.parse(t)}catch{d={detail:t}}if(!r.ok)throw new Error(d.detail||'Request failed');return d}
function esc(v=''){return String(v).replace(/[&<>\"'`]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;','`':'&#96;'}[x]))}function money(n){return n?(S.currency||'₹')+Number(n).toLocaleString('en-IN'):'Price on request'}function imageOf(p){if(!p||!p.images||!p.images[0])return '';return p.images[0].url||p.images[0].data||''}function toast(m){$('toast').textContent=m;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),2400)}function openM(h){$('modalbox').innerHTML=h;$('modal').classList.add('on')}function closeM(){$('modal').classList.remove('on')}function wa(){return S.whatsapp?'https://wa.me/'+S.whatsapp.replace(/\D/g,''):''}
async function boot(){try{S=await api('/api/settings');P=await api('/api/properties');const m=await api('/api/auth/me');if(m.role==='owner'){await ownerApp()}else if(m.role==='customer'){customer=m.customer;await customerApp()}else publicApp()}catch(e){console.error(e);publicApp()}}
function nav(){return '<nav class="nav"><div class="wrap navin"><div class="brand" onclick="location.hash=\'home\'">'+esc(S.brand||'Estate')+'<span>AI</span></div><div class="navlinks"><button class="btn ghost hideM" onclick="location.hash=\'home\'">Home</button><button class="btn ghost hideM" onclick="location.hash=\'properties\'">Properties</button><button class="btn ghost hideM" onclick="openAuth(\'customer\')">'+(customer?'My Account':'Customer Login')+'</button><button class="btn primary" onclick="openAuth(\'owner\')">Owner</button></div></div></nav>'}
function cardHTML(p){let im=imageOf(p);return '<article class="card"><div class="photo" onclick="detail(\''+p.id+'\')">'+(im?'<img src="'+im+'">':'<span class="muted">Property image</span>')+'<span class="tag">'+esc(p.purpose||p.type||'Property')+'</span></div><div class="cardbody"><div class="price">'+money(p.price)+'</div><h3>'+esc(p.title||'Untitled property')+'</h3><div class="muted">📍 '+esc(p.location||[p.locality,p.city,p.state].filter(Boolean).join(', '))+'</div><div class="chips"><span class="chip">'+esc(p.bhk||'')+'</span><span class="chip">'+esc(p.area||'')+'</span><span class="chip">'+esc(p.status||'')+'</span></div><div class="actions"><button class="btn primary" onclick="detail(\''+p.id+'\')">View property</button><button class="btn" onclick="quickEnquiry(\''+p.id+'\')">Enquire</button></div></div></article>'}
function publicApp(){const logo=S.logo_url&&/^https?:\/\//i.test(S.logo_url)?'<img src="'+esc(S.logo_url)+'" alt="'+esc(S.brand||'EstateAI')+'" style="height:38px;max-width:160px;object-fit:contain">':'';const hero=S.hero_image&&/^https?:\/\//i.test(S.hero_image)?'background-image:url(\''+S.hero_image.replace(/'/g,'%27')+'\')':'';app.innerHTML='<main>'+nav()+'<section class="hero" id="home" style="'+hero+'"><div class="wrap heroGrid"><div><div class="eyebrow">AI-powered real estate</div><h1>'+esc(S.tagline||'Find a place you will love to call home.')+'</h1><p>'+esc(S.about||'Discover verified published properties, compare options and talk to an AI property advisor.')+'</p><div class="searchbar"><input id="sq" class="field wide" placeholder="Search city, locality, property or requirement"><select id="spurpose" class="field"><option value="">Buy / Rent</option><option>Buy</option><option>Rent</option><option>Commercial</option></select><select id="stype" class="field"><option value="">Property type</option><option>Apartment</option><option>Villa</option><option>House</option><option>Plot</option><option>Commercial</option></select><select id="sbhk" class="field"><option value="">BHK</option><option>1 BHK</option><option>2 BHK</option><option>3 BHK</option><option>4 BHK</option><option>5 BHK</option></select><input id="smax" class="field" type="number" placeholder="Max price"><button class="btn primary" onclick="searchP()">Search</button></div></div><div class="heroCard"><div class="heroMock"><div><div class="chip">AI PROPERTY ADVISOR</div><h3 style="font-size:32px;margin:12px 0">Tell us what you want.</h3><p class="muted">"2 BHK in Pune under ₹70 lakh" — the assistant can search published listings and guide you to the next step.</p></div></div></div></div></section><section id="properties"><div class="wrap"><div class="sectionHead"><div><div class="eyebrow">Curated listings</div><h2>Featured properties</h2></div><span class="muted">'+P.length+' published</span></div><div id="cards" class="grid"></div></div></section><section><div class="wrap"><div class="card"><div class="cardbody" style="padding:32px"><div class="eyebrow">One platform</div><h2 style="font-size:40px;letter-spacing:-.04em">Search. Chat. Visit. Buy.</h2><p class="muted">Your AI assistant understands natural property requests, surfaces published listings, answers configured business questions and helps customers contact the owner or book a site visit.</p><div class="chips"><span class="chip">AI property search</span><span class="chip">Customer accounts</span><span class="chip">Site visits</span><span class="chip">WhatsApp + Call</span><span class="chip">Owner-controlled listings</span></div></div></div></div></section></main><div class="contactFloat">'+(S.phone?'<a class="circle" href="tel:'+esc(S.phone)+'" onclick="track(\'call\')">☎</a>':'')+(wa()?'<a class="circle" href="'+wa()+'" target="_blank" onclick="track(\'whatsapp\')">◉</a>':'')+'</div><div class="float"><button class="aiBtn" onclick="toggleChat()">✦ Ask AI</button></div><div id="chat" class="chat"><div class="chatHead"><div><b>AI Property Advisor</b><div class="muted" style="font-size:12px">Professional real-estate assistant</div></div><div><button class="btn" style="padding:6px 10px;font-size:12px;margin-right:6px" onclick="newChat()">+ New</button><button class="btn iconbtn" onclick="toggleChat()">×</button></div></div><div id="chatBody" class="chatBody"><div class="bubble ai">'+esc(S.ai_greeting||'Hi! Tell me your location, budget, BHK or property requirement.')+'</div></div><div class="chatInput"><div id="chatImagePreview" style="display:none;width:100%;margin-bottom:6px"></div><input id="chatImage" type="file" accept="image/*" style="max-width:125px;padding:8px" title="Attach property image" onchange="previewChatImage(this)"><input id="chatText" placeholder="Ask about properties..." onkeydown="if(event.key===\'Enter\')sendChat()"><button class="btn primary" onclick="sendChat()">Send</button></div></div><footer class="footer"><div class="wrap">'+esc(S.brand||'EstateAI')+' · '+esc(S.business_hours||'')+' · '+esc(S.address||'')+'</div></footer>';renderCards(P)}
function renderCards(arr){const el=$('cards');if(!el)return;el.innerHTML=arr.length?arr.map(cardHTML).join(''):'<div class="empty" style="grid-column:1/-1">No published properties match your search.</div>'}
let _lastSearchAt=0;async function searchP(){const q=$('sq').value,arr=await api('/api/properties?q='+encodeURIComponent(q)+'&ptype='+encodeURIComponent($('stype').value)+'&bhk='+encodeURIComponent($('sbhk').value)+'&max_price='+encodeURIComponent($('smax').value||0)+'&purpose='+encodeURIComponent($('spurpose')?.value||''));const now=Date.now();if(now-_lastSearchAt>2000){await track('search');_lastSearchAt=now}renderCards(arr);location.hash='properties'}async function track(k){try{await api('/api/events/'+k,{method:'POST'})}catch{}}
function detail(id){const p=P.find(x=>x.id===id);if(!p)return;let imgs=(p.images||[]).map(i=>'<img src="'+(i.url||i.data||'')+'" style="width:100%;height:140px;object-fit:cover;border-radius:12px;cursor:pointer" onclick="lightbox(\''+(i.url||i.data||'').replace(/'/g,'%27')+'\')">').join('');openM('<div class="sectionHead"><div><div class="eyebrow">'+esc(p.purpose||p.type||'Property')+'</div><h2>'+esc(p.title)+'</h2><div class="muted">📍 '+esc(p.location||'')+'</div></div><button class="btn" onclick="closeM()">×</button></div><div class="grid" style="grid-template-columns:1.15fr .85fr"><div>'+(imageOf(p)?'<img src="'+imageOf(p)+'" style="width:100%;height:330px;object-fit:cover;border-radius:18px">':'<div class="photo" style="height:330px;border-radius:18px">Property image</div>')+'<div class="chips">'+[p.bhk,p.area,p.bathrooms&&p.bathrooms+' bath',p.parking&&p.parking+' parking',p.facing&&p.facing+' facing'].filter(Boolean).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>'+(imgs?'<div class="grid" style="grid-template-columns:repeat(4,1fr)">'+imgs+'</div>':'')+'</div><div><div class="price">'+money(p.price)+'</div><p class="muted">'+esc(p.description||'')+'</p><h4>Details</h4><div class="chips">'+(p.amenities||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div><div class="actions"><button class="btn primary" onclick="quickEnquiry(\''+p.id+'\')">Enquire</button><button class="btn" onclick="visit(\''+p.id+'\')">Book visit</button>'+(S.phone?'<a class="btn" href="tel:'+esc(S.phone)+'" onclick="track(\'call\')">Call</a>':'')+(wa()?'<a class="btn" target="_blank" href="'+wa()+'" onclick="track(\'whatsapp\')">WhatsApp</a>':'')+'</div></div></div>')}
function lightbox(src){openM('<div class="actions"><button class="btn" onclick="closeM()">Close</button></div><div class="lightbox"><img src="'+src+'"></div>')}
function quickEnquiry(id){const p=P.find(x=>x.id===id);openM('<h2>Enquire about '+esc(p.title)+'</h2><p class="muted">'+money(p.price)+' · '+esc(p.location)+'</p><div class="form"><input class="field" id="ln" placeholder="Full name"><input class="field" id="lp" placeholder="Phone"><input class="field" id="le" placeholder="Email"><input class="field" id="lb" placeholder="Budget"><textarea class="field full" id="lm" placeholder="Tell us what you need"></textarea></div><label style="display:block;margin-top:12px"><input id="lc" type="checkbox" checked> I agree that the property team may contact me.</label><div class="actions"><button class="btn primary" onclick="submitLead(\''+id+'\')">Send enquiry</button><button class="btn" onclick="closeM()">Cancel</button></div>')}
async function submitLead(id){if(!$('lc').checked)return toast('Consent is required');try{await api('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('ln').value,phone:$('lp').value,email:$('le').value,budget:$('lb').value,location:'',bhk:P.find(x=>x.id===id)?.bhk||'',property_id:id,source:'Website',consent:true})});closeM();toast('Enquiry sent successfully')}catch(e){toast(e.message)}}
function visit(id){const p=P.find(x=>x.id===id);openM('<h2>Book a site visit</h2><p class="muted">'+esc(p.title)+'</p><div class="form"><input class="field" id="vn" placeholder="Full name"><input class="field" id="vp" placeholder="Phone"><input class="field" id="ve" placeholder="Email"><input class="field" id="vd" type="date"><input class="field" id="vt" type="time"><textarea class="field full" id="vnote" placeholder="Notes / requirements"></textarea></div><label style="display:block;margin-top:12px"><input id="vc" type="checkbox" checked> I agree that the property team may contact me.</label><div class="actions"><button class="btn primary" onclick="submitVisit(\''+id+'\')">Request visit</button><button class="btn" onclick="closeM()">Cancel</button></div>')}
async function submitVisit(id){if(!$('vc').checked)return toast('Consent is required');if(!$('vd').value||!$('vt').value)return toast('Choose date and time');try{const d=await api('/api/visits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('vn').value,phone:$('vp').value,email:$('ve').value,date:$('vd').value,time:$('vt').value,property_id:id,notes:$('vnote').value,consent:true})});closeM();toast(d.message)}catch(e){toast(e.message)}}
function previewChatImage(input){const box=$('chatImagePreview');if(!box)return;const file=input?.files?.[0];if(!file){box.style.display='none';box.innerHTML='';return}if(file.size>3*1024*1024){box.style.display='block';box.innerHTML='<span class="muted">Image is too large. Maximum 3 MB.</span>';return}const r=new FileReader();r.onload=()=>{box.style.display='block';box.innerHTML='<img src="'+r.result+'" alt="Selected property" style="width:72px;height:52px;object-fit:cover;border-radius:9px;border:1px solid var(--line)">';};r.readAsDataURL(file)}
async function unsaveProperty(pid){try{await api('/api/customer/saved/'+encodeURIComponent(pid),{method:'DELETE'});await customerApp();toast('Property removed from saved');}catch(e){toast(e.message)}}
function toggleChat(){$('chat').classList.toggle('on');if($('chat').classList.contains('on'))setTimeout(()=>$('chatText').focus(),100)}async function sendChat(){const input=$('chatText'),m=input.value.trim(),file=$('chatImage')?.files?.[0];if(!m&&!file)return;input.value='';const body=$('chatBody');body.innerHTML+='<div class="bubble user">'+esc(m||'Please check this property image.')+(file?' 📷':'')+'</div><div class="bubble ai" id="typing">Thinking…</div>';body.scrollTop=body.scrollHeight;try{let image_data='';if(file){if(file.size>3*1024*1024)throw new Error('Image must be 3 MB or smaller');image_data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}const d=await api('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m||'Please identify the property image and tell me what you can confirm.',session_id:chatSession,image_data})});$('typing').remove();if(d.session_id){chatSession=d.session_id;localStorage.setItem('estate_chat_session',chatSession)}if($('chatImage'))$('chatImage').value='';if($('chatImagePreview')){$('chatImagePreview').style.display='none';$('chatImagePreview').innerHTML='';}body.innerHTML+='<div class="bubble ai">'+formatAI(d.answer)+'</div>';if(d.matches&&d.matches.length){body.innerHTML+=d.matches.map(p=>'<div class="resultMini" onclick="detail(\''+p.id+'\')">'+(imageOf(p)?'<img src="'+imageOf(p)+'">':'<div class="photo" style="width:62px;height:55px;border-radius:9px"></div>')+'<div><b>'+esc(p.title)+'</b><div class="muted">'+money(p.price)+' · '+esc(p.location)+'</div></div></div>').join('')}body.scrollTop=body.scrollHeight}catch(e){$('typing').textContent=e.message}}

ion)+'"><input class="field" id="plocal" placeholder="Locality" value="'+esc(p.locality)+'"><input class="field" id="pcity" placeholder="City" value="'+esc(p.city)+'"><input class="field" id="pstate" placeholder="State" value="'+esc(p.state)+'"><input class="field" id="ppin" placeholder="Pincode" value="'+esc(p.pincode)+'"><input class="field" id="pmap" placeholder="Google Maps URL" value="'+esc(p.map_url)+'"><input class="field" id="pface" placeholder="Facing" value="'+esc(p.facing)+'"><input class="field" id="pfurn" placeholder="Furnishing" value="'+esc(p.furnishing)+'"><input class="field" id="ppark" placeholder="Parking" value="'+esc(p.parking)+'"><input class="field" id="pyear" placeholder="Construction year" value="'+esc(p.construction_year)+'"><input class="field" id="prera" placeholder="RERA number" value="'+esc(p.rera)+'">'+statusSelect+'<textarea class="field full" id="pdesc" placeholder="Complete property description">'+esc(p.description)+'</textarea><input class="field full" id="pam" placeholder="Amenities comma separated" value="'+esc((p.amenities||[]).join(', '))+'"></div><div class="actions"><button class="btn primary" onclick="saveProp('+(id?"'"+id+"'": "''")+')">Save property</button><button class="btn" onclick="closeM()">Cancel</button></div><p class="muted" style="font-size:12px;margin-top:12px">After saving, use the Image button in the property list to upload photos. Published data becomes available to the customer website and AI.</p>')}
async function saveProp(id){const p={title:$('pt').value,purpose:$('ppr').value,type:$('pty').value,price:Number($('pp').value||0),bhk:$('pb').value,bathrooms:$('pba').value,area:$('pa').value,built_up_area:$('pbu').value,plot_area:$('ppa').value,floor:$('pf').value,total_floors:$('ptf').value,location:$('ploc').value,locality:$('plocal').value,city:$('pcity').value,state:$('pstate').value,pincode:$('ppin').value,map_url:$('pmap').value,facing:$('pface').value,furnishing:$('pfurn').value,parking:$('ppark').value,construction_year:$('pyear').value,rera:$('prera').value,status:$('pstatus').value,description:$('pdesc').value,amenities:$('pam').value.split(',').map(x=>x.trim()).filter(Boolean),published:id?D.properties.find(x=>x.id===id)?.published||false:false};try{await api(id?'/api/properties/'+id:'/api/properties',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});closeM();await refreshOwner();toast('Property saved')}catch(e){toast(e.message)}}
function uploadPrompt(id){const p=D.properties.find(x=>x.id===id)||{};const imgs=(p.images||[]).map(i=>'<div class="notice"><span>'+esc(i.name||'Image')+'</span><button class="btn danger" onclick="deleteImage(\''+id+'\',\''+i.id+'\')">Remove</button></div>').join('');openM('<h2>Property images</h2><input id="imgfile" class="field" type="file" accept="image/*"><div class="actions"><button class="btn primary" onclick="uploadImage(\''+id+'\')">Upload image</button><button class="btn" onclick="closeM()">Done</button></div><div style="margin-top:14px">'+(imgs||'<div class="empty">No images yet.</div>')+'</div>')}async function uploadImage(id){const f=$('imgfile').files[0];if(!f)return toast('Choose an image');const fd=new FormData();fd.append('file',f);try{await api('/api/properties/'+id+'/images',{method:'POST',body:fd});closeM();await refreshOwner();toast('Image uploaded')}catch(e){toast(e.message)}}async function togglePublish(id,v){try{await api('/api/properties/'+id+'/publish?published='+v,{method:'POST'});await refreshOwner();if(v){toast('✅ Property published! Website pe live hai.');}else{toast('Property unpublished.');}}catch(e){toast(e.message)}}async function archiveProp(id){const p=D.properties.find(x=>x.id===id);if(!p)return;await api('/api/properties/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({...p,status:'Archived',published:false})});await refreshOwner();toast('Property archived')}async function deleteImage(pid,iid){await api('/api/properties/'+pid+'/images/'+iid,{method:'DELETE'});await refreshOwner();uploadPrompt(pid);toast('Image removed')}async function removeDemoData(){if(!confirm('Remove all demo listings?'))return;try{const r=await api('/api/owner/demo-data/remove',{method:'POST'});await refreshOwner();toast(r.removed+' demo listing(s) removed')}catch(e){toast(e.message)}}async function deleteProp(id){if(!confirm('Delete this property?'))return;await api('/api/properties/'+id,{method:'DELETE'});await refreshOwner();toast('Property deleted')}async function leadStatus(id,status){await api('/api/owner/leads/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});D=await api('/api/owner/data')}async function visitStatus(id,status){await api('/api/owner/visits/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});D=await api('/api/owner/data')}async function saveSettings(){try{await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({brand:$('sb').value,tagline:$('stg').value,owner_name:$('son').value,owner_email:$('soe').value,phone:$('sp').value,whatsapp:$('sw').value,currency:(S.currency||'₹'),business_hours:$('sh').value,address:$('sad').value,logo_url:$('sl').value,hero_image:$('shi').value,about:$('sa').value,ai_greeting:$('sg').value,ai_business_context:$('sai').value})});await refreshOwner();toast('Settings saved')}catch(e){toast(e.message)}}async function exportData(){const d=await api('/api/owner/export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='estateai-owner-export.json';a.click()}async function refreshOwner(){D=await api('/api/owner/data');S=D.settings;tab(currentTab,[...document.querySelectorAll('.side button')].find(x=>x.classList.contains('active')))}
function newChat(){const chatBody=document.getElementById('chatBody');if(chatBody){chatBody.innerHTML='<div class="bubble ai">'+esc(S.ai_greeting||'Hi! How can I help you?')+'</div>';}chatSession='s_'+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('estate_chat_session',chatSession);const chatText=document.getElementById('chatText');if(chatText){chatText.value='';chatText.focus();}const chatImage=document.getElementById('chatImage');if(chatImage)chatImage.value='';const chatImagePreview=document.getElementById('chatImagePreview');if(chatImagePreview){chatImagePreview.style.display='none';chatImagePreview.innerHTML='';}toast('New chat started');}

function formatAI(text){if(!text)return '';let t=String(text);t=t.replace(/\*\*(.+?)\*\*/g,'$1');t=t.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,'$1$2');t=t.replace(/~~(.+?)~~/g,'$1');t=t.replace(/`([^`]+)`/g,'$1');t=t.replace(/^#{1,6}\s+/gm,'');t=t.replace(/^\s*[\*\-]\s+/gm,'• ');t=t.replace(/\*/g,'');t=t.replace(/\n/g,'<br>');return t;}
